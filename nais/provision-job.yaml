# One-shot schema provisioning for melosys-muninn — see docs/db-setup.md.
#
# WHY THIS EXISTS AND `kubectl debug` DOES NOT. Measured 2026-09-12 in
# teammelosys/dev-gcp: a team member may NOT create pods, pods/exec or jobs,
# but MAY create naisjobs.nais.io. So the runbook's `kubectl debug --copy-to`
# is unavailable, and this is the route that is left.
#
# It must run AS THE APP USER — if anything else applies db/init.sql, that role
# owns all 33 tables and the pod gets permission-denied at first query. That is
# why the credentials come from the nais-generated `google-sql-` secret rather
# than a proxy session: nobody can read that secret (container.secrets.get is
# not granted), and `nais postgres proxy` logs in as the human.
#
# THE IMAGE is whatever the deploy workflow last pushed, digest-pinned — read
# it from the running Deployment (command below). It is not templated because
# this file is applied by hand, not by nais/deploy.
#
# `--dry-run` first, ALWAYS: it prints the database it resolved and the schema
# state, and writes nothing. Swap to `--yes` only after reading that output.
#
# Apply nais/provision-netpol.yaml alongside it, or the connection dies as
# CONNECT_TIMEOUT with no firewall in sight. Delete both when finished.
#
# Two values below are REPLACE_ME, and both are read from the running app's
# Deployment, which the team may read (secrets it may not):
#   image:   kubectl --context prod-gcp get deploy -n teammelosys melosys-muninn -o jsonpath='{.spec.template.spec.containers[?(@.name=="melosys-muninn")].image}'
#   secret:  kubectl --context prod-gcp get deploy -n teammelosys melosys-muninn -o jsonpath='{.spec.template.spec.volumes[*].secret.secretName}' | tr ' ' '\n' | grep sqeletor
apiVersion: nais.io/v1
kind: Naisjob
metadata:
  name: melosys-muninn-provision
  namespace: teammelosys
  labels:
    team: teammelosys
spec:
  image: REPLACE_ME_image_from_the_running_deployment
  command:
    - bun
    - db/provision.ts
    - --dry-run
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  envFrom:
    - secret: google-sql-melosys-muninn
  filesFrom:
    - secret: sqeletor-melosys-muninn-REPLACE_ME
      mountPath: /var/run/secrets/nais.io/sqlcertificate
  resources:
    limits:
      memory: 1024Mi
    requests:
      cpu: 200m
      memory: 512Mi
