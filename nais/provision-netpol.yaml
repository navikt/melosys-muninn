# Egress to the Cloud SQL instance's IPs for the provisioning job.
#
# NAIS generates one of these per (workload, sqlInstance) pair — here
# sql-melosys-muninn-melosys-muninn, selecting app=melosys-muninn.
# The provisioning Naisjob declares no gcp.sqlInstances (declaring one would
# make NAIS provision a SECOND sql user, which would then own init.sql's
# tables — the ownership failure the whole exercise avoids), so it gets no
# such policy and its connection times out at the TCP layer.
#
# This grants the job the same egress the app already has. Delete it with
# the job; it references an instance IP and must not outlive it. Copy the IP
# from the generated policy: `kubectl get networkpolicy -n teammelosys
# sql-melosys-muninn-melosys-muninn -o yaml`. Copy every ipBlock it lists, one
# `- ipBlock:` entry each; prod listed two on 2026-10-05.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sql-provision-melosys-muninn
  namespace: teammelosys
  labels:
    team: teammelosys
spec:
  podSelector:
    matchLabels:
      app: melosys-muninn-provision
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: REPLACE_ME_sql_private_ip/32
