apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: {{ app_name }}
  namespace: {{ namespace }}
  labels:
    team: {{ team }}
  annotations:
    # Without this the sidecar never injects NAIS_TOKEN_INTROSPECTION_ENDPOINT,
    # and muninn's MUNINN_AUTH=entra boot assert refuses to start. It is not an
    # optimisation — it is the difference between a pod and a CrashLoopBackOff.
    texas.nais.io/enabled: "true"
spec:
  image: {{ image }}

  # The IMAGE pins DASHBOARD_PORT=3000 and DASHBOARD_HOST=0.0.0.0 (muninn's own
  # defaults are 3010 and 127.0.0.1, which would be unreachable here). This
  # number must match that ENV or every probe is refused.
  port: 3000

  # ONE replica, and a Recreate rollout — a correctness constraint, not capacity.
  # chatState, the socket registry, the LRU, agentStatus, the pending-message
  # one-shot store and the Texas introspection cache are all process-local, so a
  # second replica answers half the requests from an empty memory. nais defaults
  # replicas.min to 2, and the default RollingUpdate would run two pods during
  # every deploy even with the pin — hence Recreate, which costs one dropped
  # socket and one in-flight turn per rollout. The client reconnects in ~2 s; the
  # turn does not come back.
  replicas:
    min: 1
    max: 1
  strategy:
    type: Recreate

  # Both paths are muninn's OPEN zone (src/auth/zones.ts) — they answer with no
  # credential, which they must, because kubelet probes the app port directly
  # and carries none. They are deliberately NOT the same endpoint:
  # /api/live touches nothing, /api/ready reads the database. Pointing liveness
  # at a DB-reading path turns a Cloud SQL blip into a restart loop, and on a
  # single-replica Recreate deployment that is an outage.
  liveness:
    path: /api/live
    initialDelay: 20
    timeout: 5
  readiness:
    path: /api/ready
    initialDelay: 20
    timeout: 5
  startup:
    path: /api/live
    initialDelay: 20
    # The entrypoint's connect budget alone is 30 s and the migrations run after
    # it, so the startup probe has to tolerate a cold first boot.
    failureThreshold: 30
    periodSeconds: 5
    timeout: 5

  azure:
    application:
      enabled: true
      tenant: {{ tenant }}
      # muninn has NO in-app login allowlist. This is the gate: the group below
      # is who may reach the app at all. `MUNINN_ADMIN_IDENTS` is a second axis
      # ON TOP of it (who is an operator), never a substitute for it.
      allowAllUsers: false
      claims:
        extra:
          # Entra emits NAVident only for an app that asks. Without it muninn
          # mints user ids from `oid` instead — login still works and admin
          # still resolves (resolveRole matches oid too), but every id and
          # display name becomes unreadable. Cheap to ask for; expensive to
          # backfill.
          - NAVident
        groups:
          - id: {{ group_muninn_bruker }}
    sidecar:
      enabled: true
      autoLogin: true
      autoLoginIgnorePaths:
        # Probes and the favicon only. Everything else — including /chat and the
        # WebSocket upgrade — must go through login, and the upgrade is the one
        # path proven by hand before this manifest was trusted (see
        # docs/step-zero-websocket.md).
        - /api/live
        - /api/ready
        - /favicon.svg
        - /favicon.ico

  gcp:
    sqlInstances:
      - name: {{ db_instance }}
        type: POSTGRES_17
        tier: {{ db_tier }}
        diskAutoresize: true
        cascadingDelete: false
        databases:
          - name: {{ db_name }}
            # This is what makes the platform inject DB_URL (rather than
            # NAIS_DATABASE_<APP>_<DB>_URL). muninn's entrypoint adopts DB_URL
            # into DATABASE_URL, and both db/ CLIs read it directly so the
            # `kubectl debug` remedies target the right database.
            envVarPrefix: DB
        flags:
          - name: timezone
            value: "Europe/Oslo"
    permissions:
      # Vertex AI. The pod authenticates to it with its own workload-identity
      # service account — there is no model API key anywhere in this manifest,
      # and that is the point: the NAV-approved path is Vertex, and Vertex takes
      # ADC. See docs/PREREQUISITES.md §7 for what is still open here.
      - resource:
          apiVersion: resourcemanager.cnrm.cloud.google.com/v1beta1
          kind: Project
          name: {{ gcp_project }}
        role: roles/aiplatform.user

  accessPolicy:
    outbound:
      external:
        # nais egress is default-deny. Anything not listed here does not exist
        # as far as the pod is concerned — which is also the safety net under
        # the model-region decision: an unapproved endpoint fails closed.
        #
        # `vertex_host` is NOT in vars-q2.json. The deploy workflow computes it
        # from gcp_project + vertex_region and passes it as a VAR, because
        # Vertex has TWO host shapes — `<region>-aiplatform.googleapis.com` for
        # a region, `aiplatform.<mr>.rep.googleapis.com` for a multi-region —
        # and a hand-maintained copy of one of them is an allowlist naming a
        # host nothing dials the day the other shape is needed.
        #
        # NOT listed, deliberately: the metadata server the credential comes
        # from (metadata.google.internal). It is node-local and outside
        # accessPolicy. See docs/PREREQUISITES.md §8.
        - host: {{ vertex_host }}

  resources:
    limits:
      memory: 1024Mi
    requests:
      cpu: 200m
      memory: 512Mi

  ingresses:
    # BOTH domains, as melosys-console serves them. `intern.dev.nav.no` needs
    # naisdevice; `ansatt.dev.nav.no` is how a team member WITHOUT developer
    # access reaches the app at all. Adding the second one is not cosmetic —
    # see MUNINN_ALLOWED_ORIGINS below, which is derived from the pair.
    - {{ ingress_intern }}
    - {{ ingress_ansatt }}

  # MUNINN_ADMIN_IDENTS arrives HERE, not in `env:` below, and this repo is
  # PUBLIC — that is the whole reason. An `oid` is a stable personal identifier
  # for a named human in the directory, so a checked-in list of them is
  # personopplysninger, unlike every other value in vars-q2.json, which is
  # infrastructure naming.
  #
  # `envFrom` injects the secret's keys VERBATIM, so the key inside this secret
  # must be literally `MUNINN_ADMIN_IDENTS`. Somebody has to create it in the
  # namespace out of band — docs/PREREQUISITES.md §10 — and doing half of it is
  # a dead pod in two different ways, which fail differently enough to be worth
  # recognising: an ABSENT secret is a kubelet CreateContainerConfigError with no
  # muninn log at all, while a secret present with a missing or misspelled key
  # reaches muninn's own boot assert, which refuses to start and says why.
  #
  # The name is ours rather than `{{ app_name }}`: nais names its own generated
  # secrets after the app. No collision rule is documented — this is hygiene,
  # not a cited constraint.
  #
  # The durable fix is not a longer allowlist: resolve admin from the `groups`
  # claim the manifest already requests, and no personal identifier exists in
  # any deploy artifact, secret or otherwise. That is a muninn change.
  envFrom:
    - secret: {{ admin_secret }}

  env:
    # --- what this process is ------------------------------------------------
    - name: MUNINN_PROFILE
      value: "nais"
    # Provenance, and the only place the pod itself states which muninn commit
    # it is running. Passed as a VAR by the workflow, resolved from the
    # dispatched ref to a SHA so that a moved upstream tag cannot rewrite
    # history. muninn does not read this; `kubectl exec … env` does, and so does
    # acceptance D5. NB the deployed Application's `image` field names the
    # action's DEFAULT date-sha tag, not `muninn-<sha>` — the default outranks a
    # custom tag (priority 9002 vs 9001), so traceability comes from this
    # variable and the GAR tag beside it, never from that field.
    - name: MUNINN_REF
      value: {{ muninn_ref }}
    - name: MUNINN_AUTH
      value: "entra"
    - name: MUNINN_TENANT
      value: {{ tenant }}
    # BOTH ingress origins, verbatim, with the scheme, comma-separated. This
    # stops the pod TWICE if it is wrong: an authenticating mode refuses to BOOT
    # on an empty value, and the origin check compares Origin against this list
    # and never against the request's own Host (deliberately, as a DNS-rebinding
    # fix) — so a same-origin POST from the deployed page is refused, silently,
    # on every write. The same list gates /chat/ws.
    #
    # DERIVED from the two ingress variables, not maintained as a third one. A
    # separate `allowed_origins` value would reproduce the exact bug this is
    # fixing: a third ingress, or a hostname correction, updates two values and
    # leaves the third stale — and the symptom is a chat page that loads and
    # then 403s every write and every socket upgrade, with nothing naming the
    # cause. Two template tokens in one scalar is a shape no melosys-console
    # variable uses today, which is why acceptance D3 reads the RENDERED
    # manifest rather than assuming it renders.
    - name: MUNINN_ALLOWED_ORIGINS
      value: "{{ ingress_intern }},{{ ingress_ansatt }}"

    # --- the model -----------------------------------------------------------
    # Vertex, via the workload-identity SA granted above. No key anywhere.
    #
    # The CHAT turn takes NONE of its Vertex configuration from here. The bot is
    # `connector: "openai-compat"` with a Vertex `baseUrl`, and muninn derives
    # everything from that URL: `isVertexEndpoint` switches the credential to
    # Application Default Credentials, `VertexTokenProvider` fetches from the
    # metadata server, and the connector retries once on a 401 with a fresh
    # token. There is deliberately no `CLAUDE_CODE_USE_VERTEX` here — that is
    # the Agent SDK's switch, it belongs to the `claude-sdk` connector this bot
    # does not use, and setting it would additionally require
    # ANTHROPIC_VERTEX_PROJECT_ID or refuse the boot.
    #
    # The two below exist for ONE consumer: the Haiku router on
    # `haikuBackend: "vertex"` (`resolveVertexHaikuTarget`, src/ai/haiku-vertex.ts).
    # It reads env and derives nothing, so it needs the project and the region
    # stated. Muninn's OWN names, not the SDK's: leaving the SDK's names unset
    # is what keeps the `claude-sdk` path off.
    #
    # ⚠️ These two and the bot's `baseUrl` name the same project and the same
    # region in two files that nothing compares. The workflow's `jq` step is
    # what keeps them equal — it BUILDS the baseUrl from {{ gcp_project }} and
    # {{ vertex_region }} rather than letting anyone maintain a second copy.
    - name: VERTEX_PROJECT_ID
      value: {{ gcp_project }}
    - name: VERTEX_REGION
      value: {{ vertex_region }}
