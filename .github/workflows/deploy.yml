name: deploy

# Builds an image from PUBLIC muninn at a pinned ref, overlaid with this repo's
# bot folder, asserts it, pushes it to the team's GAR and deploys it to dev-gcp.
# Nothing in the public repo is edited: the only things this workflow changes in
# the checkout are `bots/` (replaced wholesale) and one line removed from
# `.dockerignore`.
#
# The ref is an INPUT with no default that floats. A deploy should name the
# muninn commit it shipped, and `main` is not a name — a rollback needs to be
# "redeploy tag X", not "hope main has not moved". Whatever is passed, the
# workflow resolves it to a SHA immediately after the checkout and uses that
# SHA everywhere: a tag can be moved upstream, so "redeploy tag X" is only
# reproducible if the artifacts carry the commit the tag pointed at.
#
# NB measured 2026-08-29: public muninn carries NO TAGS AT ALL, so until it
# does, the only dispatchable value is a full 40-character commit SHA. That is
# not a defect in this guard — it is what the first deploy will need to know.
#
# `workflow_dispatch` ONLY. A pull request from a fork therefore can never run
# this and never sees a secret. Do not add a `pull_request` trigger without
# re-reading that sentence.

on:
  workflow_dispatch:
    inputs:
      muninn_ref:
        description: "A tag, or a FULL 40-character commit SHA, in the public muninn repo (never a branch, never a short SHA)"
        required: true
      cluster:
        description: "nais cluster"
        required: true
        default: dev-gcp
        type: choice
        options: [dev-gcp]

# WORKFLOW level, not job level. The one job below is the whole pipeline today,
# but every `nais/login` and `nais/deploy` needs `id-token: write`, and a job
# added later (see the fallback shape in the mimir plan) would silently get none.
permissions:
  contents: read
  id-token: write

env:
  MUNINN_REPO: REPLACE_ME_public_muninn_repo   # e.g. owner/muninn

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repo (manifest + bot folder)
        uses: actions/checkout@v4
        with:
          path: deploy

      # BEFORE the ref guard, and the order is deliberate. The guard below
      # queries the remote, so with a placeholder repo it dies on a git
      # transport error — fail-closed either way, but misdiagnosed on the very
      # first run of a fresh clone.
      - name: MUNINN_REPO must be filled in
        run: |
          case "$MUNINN_REPO" in
            REPLACE_ME*|"") echo "::error::MUNINN_REPO is still a placeholder — see docs/PREREQUISITES.md §9"; exit 1 ;;
          esac

      # POSITIVE: only a tag that really exists upstream, or a 40-hex commit
      # SHA (either case), passes. Fetch the ref list ONCE and compare EXACT
      # FIELDS through ENVIRON. The exit status is checked separately from the
      # output. `$REF` is read through `env:`, never interpolated into the body.
      # Every earlier form of this guard, and why each failed: docs/pipeline-guards.md §2.
      - name: The ref must be a tag or a full commit SHA, never a branch
        env:
          REF: ${{ inputs.muninn_ref }}
        run: |
          # [0-9a-fA-F], not [0-9a-f]. git and actions/checkout both accept an
          # uppercase object name, and with no tags upstream a pasted SHA is the
          # ONLY usable input — so a case-sensitive test would refuse a value
          # with the message "neither a tag nor a full 40-character commit SHA"
          # about something that is exactly that.
          KIND=$(printf %s "$REF" | jq -Rsr 'if test("\\A[0-9a-fA-F]{40}\\z") then "sha" else "other" end')
          if ! refs=$(git ls-remote --refs "https://github.com/$MUNINN_REPO"); then
            echo "::error::could not query $MUNINN_REPO for refs — cannot verify '$REF'"; exit 1
          fi
          # Through ENVIRON, never `awk -v`: `-v` expands escape sequences in the
          # value BEFORE the comparison, so `REF=a\142` would be compared as
          # `ab` — the guard would then pass judgement on a different string
          # than the one actions/checkout is handed.
          if printf '%s\n' "$refs" | w="refs/heads/$REF" awk 'BEGIN{w=ENVIRON["w"]} $2==w{f=1} END{exit !f}'; then
            echo "::error::'$REF' is a BRANCH in $MUNINN_REPO — pass a tag or a full commit SHA"; exit 1
          fi
          if [ "$KIND" = "sha" ]; then
            echo "ref is a commit SHA"; exit 0
          fi
          if printf '%s\n' "$refs" | w="refs/tags/$REF" awk 'BEGIN{w=ENVIRON["w"]} $2==w{f=1} END{exit !f}'; then
            echo "ref is the tag $REF"; exit 0
          fi
          echo "::error::'$REF' is neither a tag in $MUNINN_REPO nor a full 40-character commit SHA"; exit 1

      - name: Check out public muninn at the pinned ref
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MUNINN_REPO }}
          ref: ${{ inputs.muninn_ref }}
          path: muninn

      # Resolve the ref to a SHA FIRST, and use the SHA for everything after
      # this line. Nothing else names the muninn commit: the build action's
      # default tag is a date-sha over THIS repo's GITHUB_SHA, `.dockerignore`
      # excludes `.git/` so the image carries no history, and muninn has no
      # endpoint that reports a source commit (/api/dashboard-build-hash is a
      # SHA-1 of two client bundles). Without these two lines the whole
      # traceability argument for not forking rests on Actions run history.
      - name: Resolve the muninn ref to a commit SHA
        run: echo "MUNINN_SHA=$(git -C muninn rev-parse HEAD)" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------------
      # Three steps, in this order, and the order is the whole trick:
      #   1. refuse a placeholder in the VARS file        (before the assign)
      #   2. derive the Vertex base URL and assign it     (before the overlay)
      #   3. refuse a placeholder in the BOT folder       (backstop)
      # Step 1 must precede step 2 or the assign bakes REPLACE_ME_gcp_project_id
      # into every request URL. Step 2 must precede the OVERLAY COPY below, not
      # merely "the build" — placed after it, step 3's grep reads the copy that
      # was already assigned while the image bakes the unassigned one.
      # ---------------------------------------------------------------------

      # Over the VALUES of the real keys, not a `grep` over the file. A grep also
      # reads the `_comment*` keys, which say the word REPLACE_ME while
      # explaining it — so the shipped grep refused a CORRECTLY FILLED vars file
      # and would have done so forever. Measured before this line was written:
      # every value filled in, guard still exited 1 on two comment strings.
      #
      # Keys beginning `_` are documentation and are skipped. The message names
      # WHICH values are missing, which a grep could not.
      - name: No placeholder survives in the vars file
        run: |
          UNFILLED=$(jq -r '
            to_entries
            | map(select(.key | startswith("_") | not))
            | map(select(.value | tostring | test("REPLACE_ME")))
            | map(.key) | join(", ")
          ' deploy/nais/vars-q2.json)
          if [ -n "$UNFILLED" ]; then
            echo "::error::vars-q2.json still has placeholders: $UNFILLED — see docs/PREREQUISITES.md"; exit 1
          fi

      # The project and the region would otherwise live in FOUR places that
      # nothing compares: the bot's `baseUrl` (twice — project and region), the
      # manifest's `gcp.permissions`, the manifest's `VERTEX_PROJECT_ID` /
      # `VERTEX_REGION`, and the egress host. nais VARS templating rewrites only
      # the file passed as RESOURCE, so it never touches `bots/`.
      #
      # A project mismatch means `roles/aiplatform.user` is granted on one
      # project while every turn calls another: Google answers 403, the
      # connector's refresh matches 401 only, so there is no retry and no
      # diagnostic. A region mismatch means the egress allowlist names a host
      # nothing dials. Both are silent.
      #
      # So this ASSIGNS rather than compares — there is nothing left to
      # disagree with afterwards — and the egress host is COMPUTED and handed to
      # nais/deploy, so no one maintains it either.
      - name: Derive the Vertex base URL, assign it into the bot folder
        run: |
          # gcp_project, vertex_region and team leave this step by three routes
          # that all trust their shape: a URL, a `$GITHUB_ENV` line, and the
          # comma-separated `VAR:` input on the deploy.
          #
          # The check is in `jq` and the VALUES NEVER CROSS INTO THE SHELL —
          # only the names of offending keys do. `-s` + `length == 1` because a
          # concatenated stream is individually clean per document and yields a
          # MULTI-LINE value; `\A`/`\z` because Oniguruma's `$` matches before
          # a trailing newline. Every earlier form, and why each failed:
          # docs/pipeline-guards.md §3.
          jq -e -s 'length == 1 and (.[0] | type == "object")' deploy/nais/vars-q2.json > /dev/null || {
            echo "::error::vars-q2.json is not exactly one JSON object (empty, unreadable, malformed, or two documents concatenated)"; exit 1
          }

          BAD=$(jq -r '
            . as $doc
            | ["gcp_project", "vertex_region", "team"]
            | map(select(
                ($doc[.] | type) != "string"
                or $doc[.] == "null"
                or ($doc[.] | test("\\A[a-z0-9]([a-z0-9-]*[a-z0-9])?\\z") | not)
              ))
            | join(", ")
          ' deploy/nais/vars-q2.json)
          if [ -n "$BAD" ]; then
            echo "::error::not a usable value in vars-q2.json: $BAD — expected lowercase letters, digits and inner hyphens only"; exit 1
          fi

          PROJECT=$(jq -r '.gcp_project' deploy/nais/vars-q2.json)
          REGION=$(jq -r '.vertex_region' deploy/nais/vars-q2.json)
          TEAM=$(jq -r '.team' deploy/nais/vars-q2.json)

          # muninn refuses `global` at boot in either Vertex variable name, and
          # again on the URL itself — the region routes to whichever region has
          # capacity and does not report which, so it cannot satisfy a
          # deployment that must keep inference inside a named jurisdiction.
          # Caught here it is a red step; caught there it is a CrashLoopBackOff.
          case "$REGION" in
            global) echo "::error::vertex_region=global is refused — muninn will not boot on it"; exit 1 ;;
          esac

          # The shape rule is muninn's own (`vertexOpenAiBaseUrl`,
          # src/ai/haiku-vertex.ts): a location containing a hyphen is a REGION
          # and takes the prefix form; anything else is a MULTI-REGION name with
          # its own host and no prefix form at all. Do not re-derive this as an
          # allowlist of known multi-regions — that diverges silently on the
          # first unfamiliar value, which is the failure this step exists
          # against. `eu` is not hypothetical: it is where every Claude lives,
          # and Team KI's question about it is still open.
          case "$REGION" in
            *-*) HOST="${REGION}-aiplatform.googleapis.com" ;;
            *)   HOST="aiplatform.${REGION}.rep.googleapis.com" ;;
          esac
          BASE_URL="https://${HOST}/v1/projects/${PROJECT}/locations/${REGION}/endpoints/openapi"
          echo "base url: $BASE_URL"

          # `deploy/bots/`, NOT `muninn/bots/`: this is the copy the backstop
          # grep below reads and the copy the overlay step copies FROM.
          # `set -e` is EXEMPT for the non-final command of an `&&` list, and
          # the loop body's last command is the `echo` — so an unmatched glob
          # ran the body once on the literal pattern, failed the redirect, and
          # exited 0 having assigned nothing. Measured. Count instead.
          assigned=0
          for f in deploy/bots/*/config.json; do
            [ -f "$f" ] || continue
            # Workspace-scoped and named after its target, so uniqueness is
            # not the concern here that it is for a /tmp path — a job gets its
            # own workspace. The concern is a SILENT PARTIAL WRITE: an
            # interrupted jq leaves a truncated .tmp that the mv then installs
            # as the bot's config. Both halves checked, and the .tmp removed on
            # any exit rather than left in the build context.
            trap 'rm -f "$f.tmp"' EXIT
            jq --arg u "$BASE_URL" '.baseUrl = $u' "$f" > "$f.tmp" || {
              echo "::error::could not write a baseUrl into $f"; exit 1
            }
            mv "$f.tmp" "$f" || { echo "::error::could not install $f.tmp over $f"; exit 1; }
            assigned=$((assigned + 1))
            echo "assigned baseUrl in $f"
          done
          if [ "$assigned" -eq 0 ]; then
            echo "::error::no deploy/bots/*/config.json to assign a baseUrl into"; exit 1
          fi

          # A step cannot hand a value to a later step's `env:` any other way,
          # and there is exactly ONE `VAR:` line on the deploy — see the comment
          # there. `team` rides along for the same reason the base URL does:
          # hardcoding it in the build step while vars-q2.json carries its own
          # copy for `labels.team` would push to one team's GAR and label the
          # app with another.
          {
            echo "VERTEX_HOST=$HOST"
            echo "TEAM=$TEAM"
          } >> "$GITHUB_ENV"

      # A genuine backstop now, not the mechanism: it fires only if the assign
      # above was removed or matched nothing. That is also why the checked-in
      # `baseUrl` key is literally `REPLACE_ME_vertex_baseurl` — a jq assign
      # would happily CREATE a missing key, and then this grep would have
      # nothing to catch.
      - name: No placeholder survives in the bot folder
        run: |
          # The directory test is not belt-and-braces. `grep -r` on a missing
          # path exits 2, which makes the `if` FALSE — so the backstop passed
          # precisely when the thing it guards was absent. Observed live.
          if [ ! -d deploy/bots ]; then
            echo "::error::deploy/bots is missing — there is no bot folder to overlay"; exit 1
          fi
          # An EMPTY deploy/bots passes a bare grep too — the "matched nothing"
          # case. Assert the invariant this POD needs, per bot folder. muninn's
          # own nais boot line states it: "every bot on this deployment must be
          # pinned to a non-CLI connector" — the profile's CLI refusal covers
          # spawnHaiku, NOT the chat connector, and the image is built
          # WITH_CLI=false.
          #
          # The connector is checked by VALUE, not by "config.json exists":
          # `resolveConnector` is `botConfig.connector ?? "claude-cli"`, and
          # discovery WARNS AND DROPS an unknown enum value — so a mistyped
          # `"openai_compat"` still reads as pinned in the file while being
          # unset at runtime. Allowlist, therefore, not a != comparison.
          # `find`, not a glob: `deploy/bots/*` does not match a DOTFILE, so a
          # `.ghost/` directory was inspected by nothing here — and `ls -1`
          # hides it from the image's exact-set assertion too, while `cp -R`
          # copies it and muninn's own readdirSync (isDirectory only) DISCOVERS
          # it. A second, connector-less bot in the chat picker, every step
          # green. Measured.
          # Read through a FILE, not `for e in $(find …)` (which word-splits a
          # name containing a space, so the refusal names a truncated path) and
          # not `find … | while` (a pipeline puts the loop in a subshell, where
          # `found` would not propagate and `exit 1` would not fail the step).
          # `mktemp`, not a fixed /tmp path and not a `$$` suffix: on a
          # self-hosted or container runner with a shared /tmp, two concurrent
          # dispatches truncate the same file while this loop already holds it
          # open — a short read, i.e. fewer bots inspected, with the step still
          # green. `$$` does NOT close that: separate PID namespaces sharing a
          # /tmp mount hand out identical low PIDs. mktemp is unique by
          # construction, and its failure (an unset-and-unwritable TMPDIR, a
          # RUNNER_TEMP naming a directory that does not exist) is caught HERE
          # with a message — a bare redirection died with no `::error::`.
          # The trap matters for the same shared-/tmp runner: without it the
          # file is never removed, and they accumulate per dispatch forever.
          ENTRIES=$(mktemp "${RUNNER_TEMP:-/tmp}/bot-entries.XXXXXXXX") || {
            echo "::error::could not create a temp file under ${RUNNER_TEMP:-/tmp} — is it missing or read-only?"; exit 1
          }
          trap 'rm -f "$ENTRIES"' EXIT
          find deploy/bots -mindepth 1 -maxdepth 1 | sort > "$ENTRIES"
          found=0
          while IFS= read -r e; do
            name=$(basename "$e")
            [ -d "$e" ] || { echo "::error::$e is not a bot folder — deploy/bots/ holds bot directories only"; exit 1; }
            case $(printf %s "$name" | jq -Rsr 'if test("\\A[a-z0-9][a-z0-9-]*\\z") then "ok" else "bad" end') in
              ok) ;;
              *) echo "::error::bot folder name '$name' is not a plain slug — it is used unquoted downstream, hidden from ls -1 if it starts with a dot, and used as a container path"; exit 1 ;;
            esac
            found=$((found + 1))
            # -f AND -s: `[ -s ]` alone is TRUE FOR A DIRECTORY, and a CLAUDE.md
            # that is a directory passes every later check too, then throws an
            # uncaught EISDIR in readFileSync at pod boot.
            { [ -f "$e/CLAUDE.md" ] && [ -s "$e/CLAUDE.md" ]; } || {
              echo "::error::${e}/CLAUDE.md is missing, empty or not a regular file — muninn discovers a bot by that file and exits 1 on zero bots"; exit 1
            }
            [ -f "$e/config.json" ] || {
              echo "::error::${e}/config.json is missing or not a regular file"; exit 1
            }
            # `-s` + `length == 1`, the same reason as the vars guard: without
            # it a CONCATENATED STREAM passes (jq judges only the LAST document)
            # while muninn's own JSON.parse THROWS on it — and that throw is
            # caught, leaving botSettings {} and `resolveConnector` returning
            # claude-cli. Measured, both halves.
            jq -e -s 'length == 1 and (.[0].connector | . == "copilot-sdk" or . == "openai-compat" or . == "claude-sdk")' "$e/config.json" > /dev/null || {
              echo "::error::${e}/config.json must be ONE json object pinning connector to copilot-sdk, openai-compat or claude-sdk. Unset, mistyped (discovery drops an unknown enum), claude-cli, or unparseable all end up on claude-cli, which this image does not carry. NB this allowlist is CONNECTOR_VALUES minus claude-cli — a connector added to muninn must be added here too."; exit 1
            }
          done < "$ENTRIES"
          if [ "$found" -eq 0 ]; then
            echo "::error::deploy/bots contains no bot folder"; exit 1
          fi

          if grep -rn "REPLACE_ME" deploy/bots/; then
            echo "::error::a placeholder survives in the bot folder"; exit 1
          fi

      - name: Overlay the bot folder and derive the build-context ignore
        run: |
          # `rm -rf` FIRST, and it is not tidiness. Public muninn TRACKS
          # `bots/jarvis/`, and this deployment's whole trick is dropping the
          # `bots/` line from the build-context ignore — so without this line
          # jarvis rides along into the image. Measured: the build reported
          # "bots/ baked into the image: CLAUDE.md jarvis melosys". A pod that
          # discovers jarvis offers it in the chat picker, with a wikiDir that
          # does not exist, MCP servers that need `uv` and `npx`, and a Haiku
          # backend with no credential — a second, broken bot in front of a
          # colleague. This repo's `bots/` is the whole set, not an addition.
          rm -rf muninn/bots
          mkdir -p muninn/bots
          cp -R deploy/bots/. muninn/bots/
          ls -la muninn/bots

          # DERIVED, not a checked-in second copy. `nais/docker-build-push`
          # reads the ignore file at the CONTEXT root (./muninn/.dockerignore),
          # so the BuildKit `Dockerfile.dockerignore` precedence trick is no
          # longer needed — and that trick is worth retiring anyway: buildx
          # honours the dockerfile-specific file for local path contexts (our
          # case) but not for every context type.
          #
          # The grep is the point. A hand-maintained copy silently omits any
          # exclusion upstream adds later; deriving it means an upstream RENAME
          # breaks the build instead of passing quietly.
          grep -q '^bots/$' muninn/.dockerignore || {
            echo "::error::muninn/.dockerignore no longer excludes bots/ — re-check the overlay"; exit 1
          }

          # Same rule as the bot-entries listing above, and this line is why the
          # rule is written down rather than applied twice by hand: it was a
          # fixed `/tmp/di` with no uniqueness, no trap and no annotation — every
          # property the round that introduced mktemp claimed to have swept, on
          # a line that round did not touch. Measured with the target directory
          # at mode 500: rc 1, `Permission denied` on stderr, ZERO ::error::
          # annotations, and .dockerignore left UNSTRIPPED so the overlay would
          # not land. It survived `set -e` because -e is exempt for the
          # non-final command of an `&&` list — the same exemption a comment two
          # steps above already documents.
          STRIPPED=$(mktemp "${RUNNER_TEMP:-/tmp}/dockerignore.XXXXXXXX") || {
            echo "::error::mktemp failed under ${RUNNER_TEMP:-/tmp} — is it missing or read-only?"; exit 1
          }
          trap 'rm -f "$STRIPPED"' EXIT

          # `grep -v` exits 1 when it selects NO lines — a .dockerignore whose
          # only entry is `bots/`. That is a legitimate result (an empty ignore
          # file), not a failure, and the previous `&& mv` form treated it as
          # one: the mv never ran, the exclusion stayed, and the step died on
          # the `&&` list's status with nothing printed. Exit >1 is the real
          # error. rc is collected through `|| rc=$?` so `set -e` does not abort
          # before the distinction can be made.
          rc=0
          grep -v '^bots/$' muninn/.dockerignore > "$STRIPPED" || rc=$?
          if [ "$rc" -gt 1 ]; then
            echo "::error::could not read muninn/.dockerignore (grep exit $rc)"; exit 1
          fi
          # `mv`, not `cat >`. Measured both: `cat >` truncates the TARGET, so
          # it refuses a read-only .dockerignore that the previous `mv` form
          # replaced without complaint — a stricter failure on a state that
          # works today, i.e. the fix injecting its own defect. `mv` keeps the
          # old behaviour and gains the annotation, which is the whole point:
          # with muninn/ read-only the old line failed rc 1 with ZERO
          # annotations, this one names it.
          mv "$STRIPPED" muninn/.dockerignore || {
            echo "::error::could not install the stripped .dockerignore over muninn/.dockerignore"; exit 1
          }

      # Build WITHOUT pushing, and load the result into the local daemon, so the
      # assertions below run against the artifact before it can reach GAR. The
      # action's salsa/attest step is gated on push_image == 'true', so this call
      # cannot fail on attestation and salsa does not need turning off for it.
      #
      # `docker_context` is existence-checked and may be a subdirectory; files a
      # preceding step copied in are used as-is. `dockerfile` is deliberately
      # NOT set: the action uses it VERBATIM rather than joining it to the
      # context, so `dockerfile: Dockerfile` would look right and resolve to the
      # wrong path. Unset, it defaults to ./muninn/Dockerfile.
      #
      # `platforms` is deliberately omitted (builds the runner's platform only).
      # melosys-console builds linux/amd64,linux/arm64; nais runs amd64, and
      # arm64 under QEMU with a HuggingFace model bake on the critical path buys
      # nothing.
      #
      # NOTE this shape is reasoned, not measured: `outputs: type=docker`
      # through this action has not been exercised here. If the local load
      # misbehaves, the fallback is a third job between build and deploy
      # (nais/login → docker pull → the same assertions) — the shape
      # melosys-console's prod job uses. Four things do not survive that move;
      # they are enumerated in the mimir plan, and the sharpest is that
      # $GITHUB_ENV is job-scoped, so MUNINN_SHA, VERTEX_HOST *and TEAM* vanish.
      - name: Build the image and load it locally, without pushing
        id: docker-assert
        uses: nais/docker-build-push@v0
        with:
          team: ${{ env.TEAM }}
          docker_context: ./muninn
          # Explicit on BOTH calls, and the same value. The action's own default
          # tag embeds a MINUTE-resolution timestamp, so two invocations either
          # side of a minute boundary produce different names.
          tag: muninn-${{ env.MUNINN_SHA }}
          build_args: |
            WITH_MEDIA=false
            WITH_CLI=false
            WITH_EMBEDDINGS=true
          push_image: "false"
          outputs: type=docker
          salsa: true

      # Acceptance D1. The bot check asserts the EXACT SET, not "contains": too
      # few is a CrashLoopBackOff (discoverAllBots exits 1 on zero folders), and
      # too many is a broken bot offered to a colleague in the picker. Both have
      # happened here.
      #
      # The image reference comes from the ACTION rather than being rebuilt by
      # hand — the non-push call still sets outputs.image, to the locally-loaded
      # digest-less tag, so this needs no GAR base path and does not depend on
      # the two calls having agreed on a tag.
      - name: The image contains exactly this repo's bots
        env:
          IMG: ${{ steps.docker-assert.outputs.image }}
        run: |
          # `ls -1A`, both sides, and it is worth being exact about what that
          # buys, because the two ghost cases are caught by DIFFERENT things.
          # Measured:
          #   ghost in the IMAGE only  -> GOT != WANT, this comparison refuses
          #                               (under `ls -1` it was invisible here)
          #   ghost on BOTH sides      -> GOT == WANT, this comparison PASSES.
          # What refuses the both-sides case is the SLUG GUARD in the
          # bot-folder step, whose pattern is `\A[a-z0-9][a-z0-9-]*\z` — it
          # pins the FIRST character to a letter or digit (so `-foo` is refused
          # too, and the empty name), which is what refuses a dot-entry
          # unconditionally, before the overlay ever runs. Measured, all three fixtures: image-only ghost
          # -> this comparison refuses; both-sides ghost -> the slug guard
          # refuses; a both-sides ghost that somehow reached here WELL-FORMED
          # (non-empty CLAUDE.md, pinned connector) passes this whole step.
          # An earlier draft of this comment credited the per-bot loop below,
          # which is only true when the ghost is MALFORMED — do not restore it.
          # So `-1A` closes the one-sided case AND feeds the dot-entry to the
          # per-bot assertions; the set comparison alone cannot catch a ghost
          # that is present on both sides, and is not what is relied on for it.
          # FIVE distinguishable states, and each gets its OWN message. The
          # listing is SPLIT from the sort rather than piped, because a pipeline
          # takes only the rightmost status and conflates them:
          #   1. no image / daemon unreachable  -> the inspect below
          #   2. /app/bots absent               -> `ls -1A` exits non-zero
          #   3. present but empty              -> exit 0, no output
          #   4. present, set mismatch          -> the comparison below
          #   5. present, set matches           -> the per-bot loop below
          #
          # A previous round reached for `set -o pipefail` here instead. It was
          # inert for the pipeline its comment named (the per-bot `docker run |
          # jq`: jq is rightmost and already exits non-zero on bad input,
          # measured identical with and without), and it silenced state 2
          # ENTIRELY — `bash -e` aborted on this line before the
          # "overlay did not land" message could be printed, leaving a red step
          # with no `::error::` annotation at all. State 2 is reachable:
          # muninn's Dockerfile COPYs `bot[s]` as an OPTIONAL glob, so a second
          # exclusion added upstream to `.dockerignore` passes the `grep -q`
          # strip above and yields an image with no /app/bots.
          #
          # The round AFTER that one wrote this comment claiming five messages
          # and shipped four: `if ! RAW=$(docker run …)` discards the status, so
          # states 1 and 2 shared one. They are the two whose diagnosis differs
          # most — "your daemon is broken" versus "go read upstream's
          # .dockerignore" — so they are separated here by asking about the
          # image FIRST. Deliberately not by branching on docker's exit code: a
          # missing image is 125 but an unreachable daemon is 1, so an exit-code
          # case would have misfiled the very state it was added to name.
          [ -n "$IMG" ] || {
            echo "::error::nais/docker-build-push produced no image reference — the non-push call is expected to set outputs.image"; exit 1
          }
          docker image inspect "$IMG" > /dev/null 2>&1 || {
            echo "::error::docker cannot inspect $IMG — the daemon is unreachable, or the build did not load the image locally"; exit 1
          }
          RAW=$(docker run --rm --entrypoint sh "$IMG" -c 'ls -1A /app/bots') || {
            echo "::error::/app/bots is absent from the image — the Dockerfile COPYs bots/ through an optional glob, so an image without it builds green"; exit 1
          }
          GOT=$(printf '%s\n' "$RAW" | sort)
          # Same split, same reason, and it is NOT dead symmetry: `ls | sort`
          # here would report a missing deploy/bots as "not this repo's bot set"
          # (ls exits 2, sort exits 0, WANT empty). The -d check three steps
          # earlier makes that unreachable today — but leaving the shape intact
          # teaches the next reader that the shape is fine, which is how the
          # line above got written.
          WANT_RAW=$(ls -1A deploy/bots) || {
            echo "::error::could not list deploy/bots — the checkout is not what this workflow expects"; exit 1
          }
          WANT=$(printf '%s\n' "$WANT_RAW" | sort)
          echo "want: $WANT"
          echo "got:  $GOT"
          [ -n "$GOT" ] || { echo "::error::/app/bots is empty — the overlay did not land"; exit 1; }
          [ "$GOT" = "$WANT" ] || { echo "::error::/app/bots is not this repo's bot set"; exit 1; }
          # Asserted on the IMAGE, not only on deploy/bots/ — the connector is
          # the property that decides whether a turn can run at all, and a
          # source-tree check cannot see what the build actually baked.
          # NB "the image" here is the BUILT image BEFORE it is pushed: this
          # runs against the `push_image: "false"` call's locally-loaded
          # export. Nothing ties it to the pushed artifact — see the `pull`
          # comment on the push call, which is the honest statement of that
          # gap. An earlier draft of this comment said the asserted image is
          # "the artifact that is pushed and deployed", which erased exactly
          # that caveat one screen above the place it is made.
          for bot in $WANT; do
            docker run --rm --entrypoint sh "$IMG" \
              -c "test -f /app/bots/$bot/CLAUDE.md && test -s /app/bots/$bot/CLAUDE.md" \
              || { echo "::error::$bot has no usable CLAUDE.md in the image — discoverAllBots would exit 1"; exit 1; }
            docker run --rm --entrypoint sh "$IMG" -c "cat /app/bots/$bot/config.json" \
              | jq -e -s 'length == 1 and (.[0].connector | . == "copilot-sdk" or . == "openai-compat" or . == "claude-sdk")' > /dev/null \
              || { echo "::error::$bot in the IMAGE has no usable pinned connector — it would fall back to claude-cli, which this image does not carry"; exit 1; }
          done

      - name: The image carries no CLI and no ffmpeg
        env:
          IMG: ${{ steps.docker-assert.outputs.image }}
        run: |
          if docker run --rm --entrypoint sh "$IMG" -c 'command -v claude'; then
            echo "::error::the Claude CLI is in the image"; exit 1
          fi
          if docker run --rm --entrypoint sh "$IMG" -c 'command -v ffmpeg'; then
            echo "::error::ffmpeg is in the image"; exit 1
          fi

      # The bake is silent when it fails at build time (warmupEmbeddings catches
      # and logs), so the image is where it gets checked. The pod's half of this
      # is the `Embedding model ready` boot line, not a second file test.
      - name: The embedding model is baked
        env:
          IMG: ${{ steps.docker-assert.outputs.image }}
        run: |
          docker run --rm --entrypoint sh "$IMG" \
            -c 'test -s node_modules/@huggingface/transformers/.cache/Xenova/all-MiniLM-L6-v2/onnx/model_quantized.onnx' \
            || { echo "::error::WITH_EMBEDDINGS=true produced no model weights"; exit 1; }

      # `team`, `docker_context`, `build_args` and `tag` are repeated VERBATIM.
      # That identity is the only thing tying the asserted image to the pushed
      # one — a second call missing the three build args would push an image
      # sharing nothing with the one that passed. Digest equality cannot be the
      # backstop: a type=docker export and a pushed OCI image are different
      # artifacts. The push reuses the shared type=gha cache, so this is fast.
      # `team`, `docker_context`, `build_args`, `tag` and `salsa` are IDENTICAL
      # to the assert call. The calls differ in exactly three inputs, all three
      # deliberate: `push_image`, `outputs`, and `pull`.
      #
      # `pull: "false"` is the one that is about correctness rather than about
      # pushing. The action defaults it to "true", which passes `--pull` to
      # buildx: if the base image tag (`oven/bun:1-debian`) is republished in
      # the minutes between the two calls, the push call resolves a different
      # digest, every layer cache key changes, the whole chain rebuilds — and an
      # image no `docker run` ever inspected is pushed and deployed, silently.
      #
      # ⚠️ It NARROWS that window; it does not close it, and NOTHING HERE CAN
      # DETECT IT REGRESSING. There is no assertion tying the pushed artifact to
      # the asserted one — digest equality cannot serve, since a type=docker
      # export and a pushed OCI image are different artifacts — so deleting this
      # line reproduces the defect with every step green. The shape that would
      # close it is the documented fallback: a third job that pulls the pushed
      # image and re-runs the assertions against it. Recorded rather than
      # pretended, like the `outputs: type=docker` note above.
      - name: Push the asserted image to GAR
        id: docker-push
        uses: nais/docker-build-push@v0
        with:
          team: ${{ env.TEAM }}
          docker_context: ./muninn
          tag: muninn-${{ env.MUNINN_SHA }}
          pull: "false"
          build_args: |
            WITH_MEDIA=false
            WITH_CLI=false
            WITH_EMBEDDINGS=true
          salsa: true

      - name: Deploy to nais
        uses: nais/deploy/actions/deploy@v2
        env:
          CLUSTER: ${{ inputs.cluster }}
          RESOURCE: deploy/nais/app.yaml
          VARS: deploy/nais/vars-q2.json
          # The PUSH call's id, never the assertion call's: only a pushed build
          # gets `@sha256:…` appended (the action gates that on
          # push_image == 'true'), so wiring this from the assertion call would
          # deploy an un-digest-pinned tag while every assertion above still
          # passed. Without this line `app.yaml`'s `image: {{ image }}` renders
          # unresolved.
          IMAGE: ${{ steps.docker-push.outputs.image }}
          # ONE comma-separated input, not one per value. Two `VAR:` keys in one
          # `env:` mapping is a YAML error at best and last-one-wins at worst,
          # which would drop `muninn_ref` and leave `{{ muninn_ref }}`
          # unrendered. A future repair to either half edits THIS line.
          #
          # Both halves come from $GITHUB_ENV, written by earlier steps in this
          # same job. If a job boundary is ever introduced between them and
          # here, this renders "muninn_ref=,vertex_host=" with no error.
          VAR: "muninn_ref=${{ env.MUNINN_SHA }},vertex_host=${{ env.VERTEX_HOST }}"
